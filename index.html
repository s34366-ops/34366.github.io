<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio | Jinnipa Jairak</title>

  <style>
    * {
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: linear-gradient(135deg, #ffaa9c, #ffd6cf);
      color: #333;
      text-align: center;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .card {
      background: rgba(255,255,255,0.95);
      max-width: 650px;
      width: 100%;
      padding: 45px 30px;
      border-radius: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .profile-img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 7px solid white;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      animation: floating 3s ease-in-out infinite;
    }

    @keyframes floating {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    h1 {
      color: #2c3e50;
      font-size: 42px;
      margin-bottom: 5px;
    }

    h2 {
      color: #e76f61;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
    }

    .highlight {
      color: #e76f61;
    }

    .btn {
      display: inline-block;
      background: #2c3e50;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 30px;
      margin: 10px 5px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #e76f61;
      transform: scale(1.05);
    }

    .btn-pink {
      background: #e76f61;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 30px;
      }

      .profile-img {
        width: 140px;
        height: 140px;
      }

      .card {
        padding: 35px 20px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="card">

      <img
        src="images/profile.JPG"
        alt="รูปโปรไฟล์ของ Jinnipa"
        class="profile-img"
      >

      <h1>
        สวัสดีค่ะ 👋
      </h1>

      <h1>
        ฉันชื่อ <span class="highlight">จิณห์นิภา ใจรักษ์</span>
      </h1>

      <p>
        <strong>Jinnipa Jairak</strong>
      </p>

      <p>
        🎓 นักเรียนชั้นมัธยมศึกษาปีที่ 6
      </p>

      <p>
        🧬 ผู้ที่มีความสนใจในด้าน Medical Technology
      </p>

      <p>
        🔬 Science | Laboratory | Technology
      </p>

      <p>
        ยินดีต้อนรับเข้าสู่ Portfolio ของฉัน 💗
      </p>

      <a href="portfolio.html" class="btn btn-pink">
        ✨ ทำความรู้จักฉัน
      </a>

      <a href="activities.html" class="btn">
        📂 ดูผลงาน
      </a>

    </div>

  </section>

</body>
</html>
