<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiratchaya Waiyakoon | Portfolio</title>

<style>
/* =====================================================
   RESET
===================================================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Tahoma, Arial, sans-serif;
    background: #2B4592;
    color: #6495ED;
    overflow-x: hidden;
}

/* =====================================================
   พื้นหลังทะเล
===================================================== */
.ocean {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    overflow: hidden;
    z-index: -10;
    background: linear-gradient(
        to bottom,
        #2B4592 0%,
        #2B4592 40%,
        #3158A0 70%,
        #FFFFFF 100%
    );
}

/* =====================================================
   คลื่นทะเล
===================================================== */
.wave {
    position: absolute;
    width: 120%;
    height: 220px;
    left: -10%;
    bottom: -50px;
    background: #FFFFFF;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    animation: waveMove 8s ease-in-out infinite alternate;
}

.wave2 {
    position: absolute;
    width: 130%;
    height: 180px;
    left: -15%;
    bottom: -90px;
    background: rgba(255,255,255,0.7);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    animation: waveMove2 10s ease-in-out infinite alternate;
}

@keyframes waveMove {
    from { transform: translateX(-30px); }
    to { transform: translateX(40px); }
}

@keyframes waveMove2 {
    from { transform: translateX(40px); }
    to { transform: translateX(-40px); }
}

/* =====================================================
   ฟองสบู่
===================================================== */
.bubble {
    position: absolute;
    bottom: -100px;
    border: 2px solid rgba(255,255,255,0.8);
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    animation: bubbleUp linear infinite;
}

.bubble:nth-child(1) { width: 25px; height: 25px; left: 10%; animation-duration: 8s; }
.bubble:nth-child(2) { width: 15px; height: 15px; left: 25%; animation-duration: 10s; animation-delay: 2s; }
.bubble:nth-child(3) { width: 35px; height: 35px; left: 45%; animation-duration: 12s; animation-delay: 1s; }
.bubble:nth-child(4) { width: 20px; height: 20px; left: 65%; animation-duration: 9s; animation-delay: 3s; }
.bubble:nth-child(5) { width: 40px; height: 40px; left: 80%; animation-duration: 13s; animation-delay: 2s; }
.bubble:nth-child(6) { width: 12px; height: 12px; left: 90%; animation-duration: 7s; }

@keyframes bubbleUp {
    0% { bottom: -100px; opacity: 0; transform: translateX(0); }
    20% { opacity: 1; }
    50% { transform: translateX(30px); }
    100% { bottom: 110%; opacity: 0; transform: translateX(-30px); }
}

/* =====================================================
   ปลา
===================================================== */
.fish {
    position: fixed;
    font-size: 55px;
    z-index: -5;
    animation: swim linear infinite;
}

.fish1 { top: 20%; left: -100px; animation-duration: 18s; }
.fish2 { top: 45%; left: -150px; font-size: 40px; animation-duration: 24s; animation-delay: 5s; }
.fish3 { top: 70%; left: -120px; font-size: 65px; animation-duration: 21s; animation-delay: 3s; }

@keyframes swim {
    0% { transform: translateX(0) translateY(0); }
    25% { transform: translateX(30vw) translateY(-30px); }
    50% { transform: translateX(60vw) translateY(20px); }
    75% { transform: translateX(90vw) translateY(-20px); }
    100% { transform: translateX(120vw) translateY(10px); }
}

/* =====================================================
   เมนูด้านขวา
===================================================== */
.menu {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 18px;
    z-index: 1000;
}

.menu a {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    text-decoration: none;
    color: #6699FF;
    background: rgba(255,255,255,0.95);
    border: 4px solid #6699FF;
    font-size: 13px;
    font-weight: bold;
    box-shadow: 0 5px 20px rgba(0,0,0,0.25);
    transition: 0.3s;
}

.menu a:hover {
    transform: scale(1.12);
    background: #6699FF;
    color: #FFFFFF;
    border-color: #FFFFFF;
}

/* =====================================================
   SECTION
===================================================== */
section {
    min-height: 100vh;
    padding: 70px 140px 70px 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* =====================================================
   หัวข้อ
===================================================== */
.title {
    color: #6699FF;
    font-size: clamp(35px,5vw,65px);
    margin-bottom: 40px;
    text-align: center;
    font-weight: bold;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.15);
}

/* =====================================================
   หน้า PORTFOLIO
===================================================== */
#home {
    text-align: center;
}

#home .title {
    font-size: clamp(32px,5vw,65px);
    white-space: nowrap;
}

.profile-image {
    width: 360px;
    height: 360px;
    max-width: 70vw;
    max-height: 70vw;
    object-fit: cover;
    display: block;
    margin: 0 auto 30px auto;
    border-radius: 25px;
    border: 6px solid #FFFFFF;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: transform 0.3s ease;
}

.profile-image:hover {
    transform: scale(1.03);
}

.home-info {
    background: rgba(255,255,255,0.92);
    padding: 25px 50px;
    border-radius: 25px;
    border: 4px solid #6699FF;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.home-info .fullname { font-size: 30px; font-weight: bold; color: #6495ED; }
.home-info .name { font-size: 24px; margin-top: 8px; }
.home-info .school { font-size: 20px; margin-top: 10px; }

/* =====================================================
   กล่องข้อความ คำนำ / ประวัติ
===================================================== */
.content-box {
    width: min(900px,90%);
    background: rgba(255,255,255,0.94);
    border: 4px solid #6699FF;
    border-radius: 30px;
    padding: 40px;
    color: #6495ED;
    font-size: 20px;
    line-height: 2;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.personal-box {
    width: min(950px,92%);
    background: rgba(255,255,255,0.95);
    border: 4px solid #6699FF;
    border-radius: 30px;
    padding: 40px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.sub-title {
    color: #6699FF;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 20px;
    text-align: center;
}

.personal-box p {
    color: #6495ED;
    font-size: 18px;
    line-height: 1.9;
    margin-bottom: 5px;
}

/* =====================================================
   ผลงานและกิจกรรม (ปรับแก้ส่วนรูปภาพคู่)
===================================================== */
.gallery {
    width: min(1000px,95%);
    display: flex;
    flex-direction: column;
    gap: 30px;
}

.work-card {
    background: rgba(255,255,255,0.95);
    border: 4px solid #6699FF;
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.work-card:hover {
    transform: translateY(-5px);
}

/* จัดเลย์เอาต์การใส่ 2 รูปคู่กัน */
.image-group {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.image-item {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.image-item img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 15px;
    border: 2px solid #6699FF;
    display: block;
}

/* คำอธิบายย่อยใต้แต่ละรูป */
.img-caption {
    text-align: center;
    color: #4A70C6;
    font-size: 14px;
    margin-top: 8px;
    line-height: 1.4;
}

/* คำอธิบายหลักของกิจกรรม/ผลงานนั้นๆ */
.work-card .card-description {
    text-align: center;
    color: #6495ED;
    font-weight: bold;
    font-size: 18px;
    margin-top: 15px;
    padding-top: 10px;
    border-top: 2px dashed rgba(102, 153, 255, 0.4);
}

/* =====================================================
   ช่องทางการติดต่อ
===================================================== */
.contact-box {
    width: min(700px,90%);
    background: rgba(255,255,255,0.95);
    border: 4px solid #6699FF;
    border-radius: 30px;
    padding: 45px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.contact-item {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px 0;
    border-bottom: 2px solid rgba(102,153,255,0.3);
    color: #6495ED;
    font-size: 22px;
}

.contact-item:last-child { border-bottom: none; }
.contact-icon { font-size: 35px; width: 50px; text-align: center; }
.contact-item a { color: #6495ED; text-decoration: none; font-weight: bold; }
.contact-item a:hover { color: #6699FF; text-decoration: underline; }

/* =====================================================
   ปุ่มกลับหน้าแรก
===================================================== */
.top-button {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 25px;
    background: #FFFFFF;
    color: #6699FF;
    border: 3px solid #6699FF;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
}

.top-button:hover {
    background: #6699FF;
    color: #FFFFFF;
}

/* =====================================================
   MOBILE
===================================================== */
@media (max-width: 768px) {
    section {
        padding: 50px 20px 100px 20px;
    }

    .menu {
        right: 8px;
        top: auto;
        bottom: 10px;
        transform: none;
        flex-direction: row;
