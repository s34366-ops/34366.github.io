<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Activities | Jiratchaya Waiyakoon</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: linear-gradient(135deg, #9faa74, #4a6644);
      color: #333;
    }

    nav {
      background: rgba(255,255,255,0.9);
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: #c66f80;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 40px auto;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 30px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    h1 {
      color: #c66f80;
      text-align: center;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }

    .project {
      background: #ece3d2;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    .project:hover {
      transform: translateY(-8px);
    }

    .project img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
        .activity-images {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px;
      background: white;
    }

    .activity-images img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .activity-images .certificate {
      object-fit: contain;
      background: #f8f8f8;
    }

    @media (max-width: 600px) {
      .activity-images {
        grid-template-columns: 1fr;
      }

      .activity-images img {
        height: auto;
        max-height: 400px;
      }
    }

    .project-content {
      padding: 25px;
    }

    h2 {
      color: #c66f80;
    }

    p {
      line-height: 1.7;
    }

    .tag {
      display: inline-block;
      background: #f4c7d0
      padding: 8px 15px;
      border-radius: 20px;
      margin: 5px;
      font-size: 14px;
    }

    .btn {
      display: inline-block;
      background: #d7dab3;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 30px;
      margin: 25px 5px 0;
    }

    .btn:hover {
      background: #9faa74;
    }

    .center {
      text-align: center;
    }

  </style>

</head>
